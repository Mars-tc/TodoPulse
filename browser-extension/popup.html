<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>TodoPulse 设置</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-2: #2563eb;
      --ok: #16a34a;
      --err: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    h3 { font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .sub { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; }
    label { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .field { margin-bottom: 12px; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-soft);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.14); }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter .18s ease, transform .18s ease;
    }
    button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
    .ghost { background: var(--bg-soft); border: 1px solid var(--border); color: var(--muted); }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      display: none;
      word-break: break-all;
    }
    .status.show { display: block; }
    .status.ok { background: rgba(22,163,74,.1); color: var(--ok); }
    .status.err { background: rgba(220,38,38,.1); color: var(--err); }
    .status.info { background: var(--bg-soft); color: var(--muted); }
    .divider { height: 1px; background: var(--border); margin: 14px 0; }
    .tip { font-size: 11px; color: var(--muted); line-height: 1.6; }
    code { background: var(--bg-soft); padding: 1px 5px; border-radius: 4px; font-size: 11px; color: var(--accent); }
  </style>
</head>
<body>
  <h3>📋 TodoPulse</h3>
  <p class="sub">连接本地桌面应用</p>

  <div class="row">
    <div class="field" style="flex: 0 0 96px">
      <label>端口</label>
      <input id="port" type="number" placeholder="3210" />
    </div>
    <div class="field">
      <label>Token</label>
      <input id="token" type="text" placeholder="32 位令牌" />
    </div>
  </div>

  <div class="field">
    <label>默认分类</label>
    <select id="category">
      <option value="">（连接后加载）</option>
    </select>
  </div>

  <div class="field">
    <label>默认提醒</label>
    <select id="remindLead">
      <option value="">不提醒</option>
      <option value="0">截止时</option>
      <option value="10">提前 10 分钟</option>
      <option value="30">提前 30 分钟</option>
      <option value="60">提前 1 小时</option>
      <option value="1440">提前 1 天</option>
    </select>
  </div>

  <button id="test" class="primary">测试连接并保存</button>
  <div id="status" class="status"></div>

  <div class="divider"></div>
  <p class="tip">
    端口与 Token 读取自 <code>~/.config/TodoPulse/config.json</code>，
    测试成功后会自动保存到这里。
  </p>

  <script src="popup.js"></script>
</body>
</html>
